name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    uses: gia-uh/.github/.github/workflows/landing.yml@main
    with:
      docs-build: uvx --with mkdocs-material mkdocs build -d _docs
      docs-dir: _docs
